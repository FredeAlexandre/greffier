[package]
name = "greffier-outils"
version = "0.0.1"
edition = "2024"
publish = false
description = "Les vrais adaptateurs de Greffier qui pilotent des programmes du Mac : la CLI claude (l'agent : relecture et bilan), curl, uv et le Python privé (les ressources)."

