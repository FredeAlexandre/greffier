[package]
name = "greffier-capture"
version = "0.0.1"
edition = "2024"
publish = false
description = "Greffier's real capture: ScreenCaptureKit (screen, Mac audio, microphone), written as it goes to fragmented MP4 by AVAssetWriter."

[dependencies]
greffier-core = { path = "../core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
objc2-core-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-graphics = "0.3"

[dev-dependencies]
# The smoke tests (tests/real_capture.rs) read ffprobe's JSON.
serde_json = "1"

[[example]]
name = "try_writer"

[[example]]
name = "try_capture"

[[example]]
name = "replay"

[[example]]
name = "try_sleep"

[[example]]
name = "try_mp4_muxing"
