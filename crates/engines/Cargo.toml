[package]
name = "greffier-engines"
version = "0.0.1"
edition = "2024"
publish = false
description = "Greffier's real engines, plugged into the core's adapters: embedded whisper.cpp (built from source) and audio extraction by AVFoundation."

[dependencies]
greffier-core = { path = "../core" }
greffier-tools = { path = "../tools" }
serde_json = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSValue", "NSArray", "NSError", "NSObject"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "objc2-core-media"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMSampleBuffer", "CMTime"] }

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
