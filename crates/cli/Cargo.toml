[package]
name = "greffier-cli"
version = "0.0.1"
edition = "2024"
publish = false
description = "Greffier's command line for agents: reads the meetings folder, sends the writes to the Greffier process over a socket; and that process's side of the socket. The app's binary dispatches to it."

[dependencies]
greffier-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A Greffier process without a window, for the command line's end-to-end tests.
[[bin]]
name = "greffier-test-server"
path = "src/bin/greffier-test-server.rs"
doc = false
test = false
