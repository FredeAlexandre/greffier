[package]
name = "greffier-cli"
version = "0.0.1"
edition = "2024"
publish = false
description = "Greffier's command line for agents: reads the meetings folder (list, show, status); the app's binary dispatches to it."

[dependencies]
greffier-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
