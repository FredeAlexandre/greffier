[package]
name = "greffier-tools"
version = "0.0.1"
edition = "2024"
publish = false
description = "Greffier's real adapters that drive Mac programs: the claude CLI (the agent: review and summary), curl, uv and the private Python (the resources)."

[dependencies]
greffier-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
